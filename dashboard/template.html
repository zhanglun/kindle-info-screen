<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1072px; height: 1448px; background: #fff; overflow: hidden;
    font-family: "Microsoft YaHei", "SimHei", sans-serif; color: #111;
    -webkit-font-smoothing: antialiased; }
  .page { width: 100%; height: 100%; padding: 40px 48px; display: flex; flex-direction: column; }
  .header { display: flex; justify-content: space-between; align-items: flex-start;
    border-bottom: 6px solid #111; padding-bottom: 24px; }
  .date-block .d { font-size: 88px; font-weight: 900; letter-spacing: 2px; }
  .date-block .w { font-size: 40px; font-weight: 700; color: #333; margin-top: 4px; }
  .weather { text-align: right; }
  .weather .city { font-size: 34px; font-weight: 700; color: #333; }
  .weather .t { font-size: 120px; font-weight: 900; line-height: 1.0; }
  .weather .t span { font-size: 56px; font-weight: 700; }
  .weather .c { font-size: 36px; font-weight: 700; color: #333; }
  .forecast { display: flex; border-bottom: 3px solid #111; padding: 20px 0; }
  .fday { flex: 1; text-align: center; }
  .fday .fl { font-size: 28px; color: #555; font-weight: 700; }
  .fday .fc { font-size: 32px; font-weight: 900; margin: 8px 0; }
  .fday .ft { font-size: 30px; font-weight: 700; }
  .fday .ft small { color: #777; font-weight: 400; }
  .strip { display: flex; gap: 20px; padding: 24px 0; border-bottom: 3px solid #111; }
  .cd-card { flex: 1; border: 5px solid #111; border-radius: 16px; padding: 16px 10px; text-align: center; }
  .cd-card .n { font-size: 28px; font-weight: 700; color: #333; }
  .cd-card .v { font-size: 64px; font-weight: 900; line-height: 1.1; }
  .cd-card .v small { font-size: 26px; font-weight: 700; }
  .cd-card .dt { font-size: 22px; color: #777; }
  .cols { display: flex; gap: 40px; flex: 1; padding-top: 28px; min-height: 0; }
  .col { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .sec-title { font-size: 34px; font-weight: 900; border-left: 14px solid #111;
    padding-left: 14px; margin-bottom: 18px; }
  .todo li { list-style: none; font-size: 33px; font-weight: 600; padding: 10px 0;
    border-bottom: 2px dashed #bbb; }
  .todo li::before { content: "☐  "; font-weight: 900; }
  .rss li { list-style: none; font-size: 30px; font-weight: 600; padding: 11px 0;
    border-bottom: 2px dashed #bbb; line-height: 1.35; }
  .rss .tag { display: inline-block; background: #111; color: #fff; font-size: 20px;
    font-weight: 700; padding: 2px 10px; border-radius: 6px; margin-right: 10px;
    vertical-align: middle; }
  .footer { margin-top: auto; text-align: right; font-size: 22px; color: #999; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="date-block">
      <div class="d">__DATE__</div>
      <div class="w" id="weekday"></div>
    </div>
    <div class="weather" id="weather"></div>
  </div>
  <div class="forecast" id="forecast"></div>
  <div class="strip" id="countdowns"></div>
  <div class="cols">
    <div class="col">
      <div class="sec-title">待办</div>
      <ul class="todo" id="todo"></ul>
    </div>
    <div class="col">
      <div class="sec-title">资讯</div>
      <ul class="rss" id="rss"></ul>
    </div>
  </div>
  <div class="footer">Kindle Dashboard</div>
</div>
<script>
const DATA = /*__DATA__*/null;
document.querySelector(".d").textContent = DATA.date;
document.getElementById("weekday").textContent = DATA.weekday + (DATA.time ? " · " + DATA.time : "");

const w = document.getElementById("weather");
if (DATA.weather) {
  w.innerHTML = '<div class="city">' + DATA.weather.city + '</div>' +
    '<div class="t">' + DATA.weather.temp + '<span>°C</span></div>' +
    '<div class="c">' + DATA.weather.code + ' · 风速 ' + DATA.weather.wind + 'km/h</div>';
} else {
  w.innerHTML = '<div class="city">' + (DATA.weather_error || "无天气数据") + '</div>';
}

const fc = document.getElementById("forecast");
if (DATA.weather && DATA.weather.days) {
  fc.innerHTML = DATA.weather.days.map(d =>
    '<div class="fday"><div class="fl">' + d.label + '</div>' +
    '<div class="fc">' + d.code + '</div>' +
    '<div class="ft">' + d.hi + '° <small>/ ' + d.lo + '°</small></div></div>').join("");
}

document.getElementById("countdowns").innerHTML = DATA.countdowns.map(c =>
  '<div class="cd-card"><div class="n">距' + c.name + '</div>' +
  '<div class="v">' + c.days + '<small> 天</small></div>' +
  '<div class="dt">' + c.date + '</div></div>').join("");

document.getElementById("todo").innerHTML = DATA.todo.length
  ? DATA.todo.map(t => "<li>" + t + "</li>").join("")
  : "<li>暂无待办</li>";

document.getElementById("rss").innerHTML = DATA.rss.length
  ? DATA.rss.map(r => "<li><span class='tag'>" + r.src + "</span>" + r.title + "</li>").join("")
  : "<li>暂无资讯</li>";
</script>
</body>
</html>
