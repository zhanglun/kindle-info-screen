<!DOCTYPE html>
<html lang="zh-CN" data-orientation="/*__ORIENTATION__*/portrait">
<head>
<meta charset="utf-8">
<!-- kindle-template: name=诗笺 orientations=portrait,landscape -->
<style>
  /* 诗笺 —— 夜里的一页诗。一言竖排如笺, 成语与月相为注。
     墨色纸面, 大量留白, 只为一句被摘中的话。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1072px; height: 1448px; background: #0b0b0b; color: #f2f2ef;
    font-family: "Songti SC", "SimSun", "Microsoft YaHei", serif;
    -webkit-font-smoothing: antialiased; overflow: hidden; }
  .page { width: 100%; height: 100%; padding: 90px 100px 76px;
    display: flex; gap: 40px; }

  /* 主笺: 一言竖排 */
  .scroll { flex: 1; display: flex; justify-content: center; align-items: center;
    writing-mode: vertical-rl; }
  .qtext { font-size: 52px; line-height: 1.9; letter-spacing: 12px;
    max-height: 1080px; }
  .qfrom { font-size: 24px; color: #9a9a95; margin-right: 40px; letter-spacing: 6px; }

  /* 侧注: 月相 + 成语 */
  .side { width: 320px; display: flex; flex-direction: column; }
  .moonline { display: flex; align-items: center; gap: 12px;
    font-size: 20px; color: #8f8f8a; }
  .moonline svg { width: 30px; height: 30px; }
  .side .dt { font-size: 20px; color: #8f8f8a; margin-top: 10px; letter-spacing: 1px; }

  .idiom { margin-top: auto; padding-top: 26px; border-top: 1px solid #2a2a2a; }
  .idiom .h { font-size: 14px; color: #8f8f8a; letter-spacing: 8px; margin-bottom: 14px; }
  .idiom .w { font-size: 40px; font-weight: 700; letter-spacing: 4px; }
  .idiom .p { font-size: 17px; color: #6f6f6f; margin-top: 6px; }
  .idiom .m { font-size: 19px; color: #b8b8b2; line-height: 1.75; margin-top: 12px; }

  /* 横版: 一言横排大字, 成语右下 */
  @media (min-width: 1200px) {
    html, body { width: 1448px; height: 1072px; }
    .page { padding: 84px 110px 72px; flex-direction: column; gap: 0; }
    .scroll { writing-mode: horizontal-tb; width: 100%; align-items: center;
              justify-content: flex-start; }
    .qtext { font-size: 60px; letter-spacing: 6px; max-height: none; }
    .qfrom { margin: 26px 0 0; }
    .side { width: 100%; flex-direction: row; align-items: center; gap: 30px; }
    .side .dt { margin: 0 0 0 auto; }
    .idiom { margin-top: 40px; padding-top: 24px; }
    .idiom .w { font-size: 32px; }
    .idiom .m { margin-top: 8px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="scroll">
    <div class="qtext" id="qtext">……</div>
    <div class="qfrom" id="qfrom"></div>
  </div>
  <div class="side">
    <div>
      <div class="moonline" id="moonline"></div>
      <div class="dt" id="dt"></div>
    </div>
    <div class="idiom">
      <div class="h">每 日 成 语</div>
      <div class="w" id="iw">——</div>
      <div class="p" id="ip"></div>
      <div class="m" id="im"></div>
    </div>
  </div>
</div>
<script>
const DATA = /*__DATA__*/null;

document.getElementById("dt").textContent =
  [DATA.date, DATA.weekday, DATA.lunar ? "农历 " + DATA.lunar : "",
   DATA.jieqi || ""].filter(Boolean).join(" · ");

const y = DATA.yiyan;
if (y && y.text) {
  document.getElementById("qtext").textContent = y.text;
  document.getElementById("qfrom").textContent =
    "—— " + (y.who ? y.who + (y.from ? "《" + y.from + "》" : "") : y.from);
} else {
  document.getElementById("qtext").textContent = "今天没有摘到一言,明天再来。";
}

function moonSvg(name){
  const o = 'fill="none" stroke="#f2f2ef" stroke-width="1.6"', f = 'fill="#f2f2ef"';
  const p = {
    "新月": `<circle cx="12" cy="12" r="9" ${o}/>`,
    "娥眉月": `<circle cx="12" cy="12" r="9" ${o}/><path d="M12,3 A9,9 0 0 1 12,21 A4,9 0 0 0 12,3 Z" ${f}/>`,
    "上弦月": `<circle cx="12" cy="12" r="9" ${o}/><path d="M12,3 A9,9 0 0 1 12,21 Z" ${f}/>`,
    "盈凸月": `<circle cx="12" cy="12" r="9" ${o}/><path d="M12,3 A9,9 0 0 1 12,21 A5.5,9 0 0 1 12,3 Z" ${f}/>`,
    "满月": `<circle cx="12" cy="12" r="9" ${o}/><circle cx="12" cy="12" r="9" ${f}/>`,
    "亏凸月": `<circle cx="12" cy="12" r="9" ${o}/><path d="M12,3 A9,9 0 0 0 12,21 A5.5,9 0 0 0 12,3 Z" ${f}/>`,
    "下弦月": `<circle cx="12" cy="12" r="9" ${o}/><path d="M12,3 A9,9 0 0 0 12,21 Z" ${f}/>`,
    "残月": `<circle cx="12" cy="12" r="9" ${o}/><path d="M12,3 A9,9 0 0 0 12,21 A4,9 0 0 1 12,3 Z" ${f}/>`
  };
  return `<svg viewBox="0 0 24 24">${p[name] || p["满月"]}</svg>`;
}
if (DATA.moon) {
  document.getElementById("moonline").innerHTML =
    moonSvg(DATA.moon.name) + "<span>" + DATA.moon.name + " · 月面 " + DATA.moon.illum + "%</span>";
}

const id = DATA.idiom;
if (id && id.w) {
  document.getElementById("iw").textContent = id.w;
  document.getElementById("ip").textContent = id.p || "";
  document.getElementById("im").textContent = id.m || "";
}
</script>
</body>
</html>
