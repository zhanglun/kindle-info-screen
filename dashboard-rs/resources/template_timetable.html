<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- kindle-template: name=时刻表 orientations=portrait,landscape -->
<style>
  /* 时刻表风 —— 等宽数据板 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1072px; height: 1448px; background: #f6f6f2; color: #17170f;
    font-family: "Consolas", "Microsoft YaHei", monospace;
    font-variant-numeric: tabular-nums; overflow: hidden; }
  .cjk { font-family: "Microsoft YaHei", sans-serif; }
  .page { width: 100%; height: 100%; padding: 34px 46px 26px; display: flex; flex-direction: column; }

  .board { background: #17170f; color: #f6f6f2; padding: 18px 26px; display: flex;
    justify-content: space-between; align-items: center; }
  .board .t { font-size: 34px; font-weight: 700; letter-spacing: 4px; }
  .board .s { font-size: 24px; letter-spacing: 1px; }

  .clockrow { display: flex; align-items: baseline; gap: 36px; padding: 24px 6px 20px;
    border-bottom: 4px double #17170f; }
  .clockrow .time { font-size: 96px; font-weight: 700; line-height: 0.9; }
  .clockrow .w { margin-left: auto; text-align: right; }
  .clockrow .w .big { font-size: 74px; font-weight: 700; line-height: 1; }
  .clockrow .w .sm { font-size: 26px; margin-top: 8px; }

  .sec { display: flex; justify-content: space-between; align-items: baseline;
    background: #17170f; color: #f6f6f2; padding: 6px 16px; margin: 16px 0 4px; }
  .sec .cn { font-family: "Microsoft YaHei"; font-size: 25px; font-weight: 700; }
  .sec .en { font-size: 20px; letter-spacing: 3px; }

  .row { display: flex; align-items: baseline; padding: 8px 6px; font-size: 29px; }
  .row:nth-child(even) { background: #ebebe4; }
  .row .k { white-space: nowrap; }
  .row .dots { flex: 1; margin: 0 14px; border-bottom: 3px dotted #9a9a8e; transform: translateY(-8px); }
  .row .v { font-weight: 700; white-space: nowrap; }
  .row .v small { font-weight: 400; font-size: 22px; color: #55554a; }

  .fcrow { display: flex; padding: 8px 6px; font-size: 29px; align-items: baseline; }
  .fcrow:nth-child(even) { background: #ebebe4; }
  .fcrow .d { width: 150px; }
  .fcrow .ic { width: 52px; }
  .fcrow .ic svg { width: 34px; height: 34px; transform: translateY(6px); }
  .fcrow .c { width: 190px; }
  .fcrow .hi { width: 120px; font-weight: 700; }
  .fcrow .lo { color: #55554a; }

  .todo .box { display: inline-block; width: 20px; height: 20px; border: 2.5px solid #17170f;
    margin-right: 16px; transform: translateY(2px); }
  .news .src { color: #55554a; font-size: 24px; flex: none; }
  .news .row { white-space: nowrap; overflow: hidden; }
  .news .tt { overflow: hidden; text-overflow: ellipsis; }

  .foot { margin-top: auto; padding-top: 14px; border-top: 4px double #17170f;
    display: flex; justify-content: space-between; font-size: 20px; color: #55554a; }

  /* 横版(1448x1072): 左列五日预报+待办, 右列倒数日+资讯 */
  @media (min-width: 1200px) {
    html, body { width: 1448px; height: 1072px; }
    .page { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto 1fr auto 1fr auto;
            column-gap: 44px; padding: 26px 40px 20px; }
    .page > :nth-child(1) { grid-area: 1 / 1 / 2 / 3; }
    .page > :nth-child(2) { grid-area: 2 / 1 / 3 / 3; }
    .page > :nth-child(3) { grid-area: 3 / 1 / 4 / 2; }
    .page > :nth-child(4) { grid-area: 4 / 1 / 5 / 2; }
    .page > :nth-child(5) { grid-area: 3 / 2 / 4 / 3; }
    .page > :nth-child(6) { grid-area: 4 / 2 / 5 / 3; }
    .page > :nth-child(7) { grid-area: 5 / 1 / 6 / 2; }
    .page > :nth-child(8) { grid-area: 6 / 1 / 7 / 2; }
    .page > :nth-child(9) { grid-area: 5 / 2 / 6 / 3; }
    .page > :nth-child(10) { grid-area: 6 / 2 / 7 / 3; }
    .page > :nth-child(11) { grid-area: 7 / 1 / 8 / 3; }
    .board .t { font-size: 26px; }
    .board .s { font-size: 20px; }
    .clockrow { padding: 14px 6px 12px; }
    .clockrow .time { font-size: 64px; }
    .clockrow .w .big { font-size: 48px; }
    .clockrow .w .sm { font-size: 22px; margin-top: 4px; }
    .sec { margin: 10px 0 2px; }
    .row, .fcrow { font-size: 23px; padding: 5px 6px; }
    .fcrow .d { width: 110px; }
    .fcrow .ic { width: 40px; }
    .fcrow .ic svg { width: 26px; height: 26px; transform: translateY(4px); }
    .fcrow .c { width: 150px; }
    .fcrow .hi { width: 90px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="board">
    <span class="t">INFO BOARD</span>
    <span class="s" id="boardright"></span>
  </div>

  <div class="clockrow">
    <div class="time num" id="time">--:--</div>
    <div class="w">
      <div class="big num"><span id="temp">--</span>°C</div>
      <div class="sm cjk" id="cond"></div>
    </div>
  </div>

  <div class="sec"><span class="cn">五日预报</span><span class="en">FORECAST</span></div>
  <div id="forecast"></div>

  <div class="sec"><span class="cn">倒数日</span><span class="en">COUNTDOWN</span></div>
  <div id="count"></div>

  <div class="sec"><span class="cn">待办</span><span class="en">TODO</span></div>
  <div class="todo" id="todo"></div>

  <div class="sec"><span class="cn">资讯</span><span class="en">NEWS</span></div>
  <div class="news" id="rss"></div>

  <div class="foot">
    <span>KINDLE INFO BOARD</span>
    <span id="footright"></span>
  </div>
</div>
<script>
const DATA = /*__DATA__*/null;
function icon(code){
  const c = 'fill="none" stroke="#17170f" stroke-width="1.7" stroke-linecap="round"';
  if (code<=1) return `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" ${c}/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" ${c}/></svg>`;
  if (code<=3) return `<svg viewBox="0 0 24 24"><path d="M6 18a4 4 0 1 1 .6-7.96A5.5 5.5 0 0 1 17.4 9.5 3.75 3.75 0 0 1 17 18H6z" ${c}/></svg>`;
  if (code<=48) return `<svg viewBox="0 0 24 24"><path d="M6 14a4 4 0 1 1 .6-7.96A5.5 5.5 0 0 1 17.4 5.5 3.75 3.75 0 0 1 17 14H6z" ${c}/><path d="M5 18h14M7 21h10" ${c}/></svg>`;
  if (code<=67 || (code>=80 && code<=82)) return `<svg viewBox="0 0 24 24"><path d="M6 13a4 4 0 1 1 .6-7.96A5.5 5.5 0 0 1 17.4 4.5 3.75 3.75 0 0 1 17 13H6z" ${c}/><path d="M8 16l-1.5 4M13 16l-1.5 4M18 16l-1.5 4" ${c}/></svg>`;
  if (code<=86) return `<svg viewBox="0 0 24 24"><path d="M6 13a4 4 0 1 1 .6-7.96A5.5 5.5 0 0 1 17.4 4.5 3.75 3.75 0 0 1 17 13H6z" ${c}/><path d="M8 17.5v.01M12 20v.01M16 17.5v.01" stroke="#17170f" stroke-width="2.6" stroke-linecap="round"/></svg>`;
  return `<svg viewBox="0 0 24 24"><path d="M6 12a4 4 0 1 1 .6-7.96A5.5 5.5 0 0 1 17.4 3.5 3.75 3.75 0 0 1 17 12H6z" ${c}/><path d="M13 13l-3 5h3l-2 5 5.5-7h-3l2-3z" fill="#17170f"/></svg>`;
}

document.getElementById("boardright").textContent =
  DATA.year + "-" + DATA.date.replace("月","-").replace("日","") + " " + DATA.weekday;
document.getElementById("time").textContent = DATA.time;

const w = DATA.weather;
if (w) {
  document.getElementById("temp").textContent = w.temp;
  document.getElementById("cond").textContent = w.code + " · " + w.city + " · 风速 " + w.wind + "km/h";
  document.getElementById("forecast").innerHTML = w.days.map(d =>
    '<div class="fcrow"><span class="d cjk">' + d.label + '</span><span class="ic">' + icon(d.wc) + '</span>' +
    '<span class="c cjk">' + d.code + '</span><span class="hi">' + d.hi + '°</span><span class="lo">' + d.lo + '°</span></div>').join("");
} else {
  document.getElementById("cond").textContent = DATA.weather_error || "暂无天气数据";
}

document.getElementById("count").innerHTML = DATA.countdowns.map(c =>
  '<div class="row"><span class="k cjk">距 ' + c.name + ' (' + c.date + ')</span>' +
  '<span class="dots"></span><span class="v">' + c.days + ' <small>DAYS</small></span></div>').join("");

const todo = DATA.todo;
document.getElementById("todo").innerHTML = todo.length
  ? todo.map(t => '<div class="row"><span class="box"></span><span class="cjk">' + t + '</span></div>').join("")
  : '<div class="row cjk">今日无事</div>';

document.getElementById("rss").innerHTML = DATA.rss.length
  ? DATA.rss.slice(0, 3).map(r => '<div class="row"><span class="src cjk">[' + r.src + ']</span>' +
      '<span class="dots"></span><span class="tt cjk">' + r.title + '</span></div>').join("")
  : '<div class="row cjk">暂无资讯</div>';

document.getElementById("footright").textContent = "UPDATED " + DATA.time;
</script>
</body>
</html>
