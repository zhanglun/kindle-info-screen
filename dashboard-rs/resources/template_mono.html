<!DOCTYPE html>
<html lang="zh-CN" data-orientation="/*__ORIENTATION__*/portrait">
<head>
<meta charset="utf-8">
<!-- kindle-template: name=极简卡片 orientations=portrait,landscape -->
<style>
  /* 极简卡片 —— 一页全展示。白底黑字、直角、无渐变无阴影无动效;
     只剩字重、字号和 1px 分隔线,信息一屏读完。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1072px; height: 1448px; background: #ffffff; color: #111111;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden; }
  .page { width: 100%; height: 100%; padding: 64px; display: flex; flex-direction: column; }

  /* 页眉:日期左,时刻右,之下全靠一条线 */
  .head { display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 16px; }
  .head .d { font-size: 44px; font-weight: 700; letter-spacing: 2px; }
  .head .d small { font-size: 26px; font-weight: 400; color: #444; margin-left: 14px; letter-spacing: 0; }
  .head .t { font-size: 30px; font-family: "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; }
  .rule { height: 0; border-top: 3px solid #111; margin-bottom: 16px; }

  /* 分区:小标签 + 内容,标签是唯一的装饰 */
  .sect { padding: 16px 0; }
  .sect + .sect { border-top: 1px solid #d8d8d8; }
  .lab { font-size: 17px; color: #8a8a8a; letter-spacing: 6px; margin-bottom: 12px; }

  /* 天气 */
  .wx { display: flex; align-items: baseline; gap: 22px; }
  .wx .temp { font-size: 96px; font-weight: 200; line-height: 1;
    font-variant-numeric: tabular-nums; }
  .wx .temp sup { font-size: 34px; font-weight: 400; }
  .wx .cond { font-size: 30px; font-weight: 700; }
  .wx .sub { font-size: 20px; color: #555; line-height: 1.6; }
  .fcast { display: flex; margin-top: 16px; }
  .fcast .day { flex: 1; padding: 10px 0 0; border-top: 1px solid #d8d8d8; }
  .fcast .day + .day { margin-left: 16px; }
  .fcast .dl { font-size: 18px; color: #555; }
  .fcast .dt { font-size: 25px; font-weight: 700; margin-top: 2px;
    font-variant-numeric: tabular-nums; }
  .fcast .dt small { font-size: 19px; font-weight: 400; color: #555; }
  .fcast .dc { font-size: 18px; color: #555; margin-top: 2px; }

  /* 待办 */
  .todo li { list-style: none; display: flex; align-items: flex-start; gap: 16px;
    padding: 8px 0; font-size: 27px; line-height: 1.6; }
  .todo .box { flex: none; width: 20px; height: 20px; border: 2px solid #111; margin-top: 12px; }
  .todo .none { font-size: 22px; color: #8a8a8a; padding: 6px 0; }

  /* 倒数日:一行流 */
  .cds { display: flex; flex-wrap: wrap; gap: 8px 40px; font-size: 26px; }
  .cds .cd b { font-size: 34px; font-weight: 700; padding: 0 4px;
    font-variant-numeric: tabular-nums; }
  .cds .cd span { color: #555; font-size: 20px; }

  /* 一言 */
  .quote .q { font-size: 29px; line-height: 1.7; }
  .quote .a { font-size: 19px; color: #555; margin-top: 8px; text-align: right; }

  .spacer { flex: 1; }
  .foot { margin-top: auto; font-size: 16px; color: #aaaaaa;
    display: flex; justify-content: space-between; padding-top: 24px; }

  /* 横版(1448x1072):左右两区,天气占左,其余占右 */
  @media (min-width: 1200px) {
    html, body { width: 1448px; height: 1072px; }
    .page { padding: 48px 64px 40px; }
    .cols { flex: 1; display: flex; min-height: 0; }
    .col-l { width: 44%; padding-right: 40px; }
    .col-r { flex: 1; border-left: 1px solid #d8d8d8; padding-left: 40px;
             display: flex; flex-direction: column; }
    .wx .temp { font-size: 130px; }
    .spacer { flex: 1; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <span class="d" id="d">——</span>
    <span class="t" id="t"></span>
  </div>
  <div class="rule"></div>

  <div class="cols">
    <div class="col-l">
      <div class="sect">
        <div class="lab">天 气</div>
        <div class="wx">
          <span class="temp"><span id="temp">--</span><sup>°C</sup></span>
          <span>
            <span class="cond" id="cond">——</span>
            <div class="sub" id="wxsub"></div>
          </span>
        </div>
        <div class="fcast" id="fcast"></div>
      </div>
      <div class="sect">
        <div class="lab">倒 数 日</div>
        <div class="cds" id="cds"></div>
      </div>
      <div class="spacer"></div>
      <div class="sect quote">
        <div class="lab">每 日 一 言</div>
        <div class="q" id="q"></div>
        <div class="a" id="a"></div>
      </div>
    </div>

    <div class="col-r">
      <div class="sect" style="flex:1">
        <div class="lab">待 办 <span id="todon" style="letter-spacing:0"></span></div>
        <ul class="todo" id="todo"></ul>
      </div>
      <div class="spacer"></div>
    </div>
  </div>

  <div class="foot">
    <span>极简卡片</span>
    <span id="moon"></span>
  </div>
</div>
<script>
const DATA = /*__DATA__*/null;
const WMO = {0:"晴",1:"晴间多云",2:"多云",3:"阴",45:"雾",48:"雾凇",51:"毛毛雨",53:"毛毛雨",55:"毛毛雨",56:"冻雨",57:"冻雨",61:"小雨",63:"中雨",65:"大雨",66:"冻雨",67:"冻雨",71:"小雪",73:"中雪",75:"大雪",77:"雪粒",80:"阵雨",81:"阵雨",82:"强阵雨",85:"阵雪",86:"阵雪",95:"雷暴",96:"雷暴冰雹",99:"雷暴冰雹"};

document.getElementById("d").innerHTML = DATA.date +
  '<small>' + DATA.weekday + (DATA.lunar ? " · 农历" + DATA.lunar : "") +
  (DATA.jieqi ? " · " + DATA.jieqi : "") + '</small>';
document.getElementById("t").textContent = DATA.time;

const w = DATA.weather;
if (w) {
  document.getElementById("temp").textContent = w.temp;
  document.getElementById("cond").textContent = w.code + " · " + w.city;
  const sub = ["风速 " + w.wind + " km/h", "日出 " + w.sunrise + " · 日落 " + w.sunset];
  if (w.aqi != null) sub.push("PM2.5 " + w.pm25 + " · " + w.aqi_desc);
  document.getElementById("wxsub").innerHTML = sub.join("<br>");
  document.getElementById("fcast").innerHTML = w.days.map(d =>
    '<div class="day"><div class="dl">' + d.label + '</div>' +
    '<div class="dt">' + d.hi + '° <small>/ ' + d.lo + '°</small></div>' +
    '<div class="dc">' + d.code + '</div></div>').join("");
} else {
  document.getElementById("cond").textContent = DATA.weather_error || "暂无天气数据";
}

const todo = DATA.todo || [];
document.getElementById("todon").textContent = todo.length ? "· 共 " + todo.length + " 项" : "";
document.getElementById("todo").innerHTML = todo.length
  ? todo.map(t => '<li><span class="box"></span><span>' + t + '</span></li>').join("")
  : '<div class="none">今日无待办</div>';

const cds = DATA.countdowns || [];
document.getElementById("cds").innerHTML = cds.length
  ? cds.slice(0, 6).map(c =>
      '<span class="cd">距' + c.name + '<b>' + c.days + '</b><span>天 · ' + c.date + '</span></span>').join("")
  : '<span style="font-size:22px;color:#8a8a8a">暂无倒数日</span>';

const y = DATA.yiyan;
if (y && y.text) {
  document.getElementById("q").textContent = "「" + y.text + "」";
  document.getElementById("a").textContent =
    "—— " + (y.who ? y.who + (y.from ? " 《" + y.from + "》" : "") : y.from || "");
} else {
  document.getElementById("q").textContent = "今天没有摘到一言。";
}
document.getElementById("moon").textContent =
  DATA.moon ? DATA.moon.name + " · 月面 " + DATA.moon.illum + "%" : "";
</script>
</body>
</html>
