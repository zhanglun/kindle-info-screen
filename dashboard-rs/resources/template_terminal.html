<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- kindle-template: name=终端播报 orientations=portrait,landscape -->
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1072px;height:1448px;background:#101214;color:#e8e8e2;font-family:"SF Mono",Menlo,Consolas,"PingFang SC",monospace;overflow:hidden}.page{position:relative;width:100%;height:100%;padding:34px 42px;display:flex;flex-direction:column}.wallpaper{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.12;filter:grayscale(1);pointer-events:none}.page>*:not(.wallpaper){position:relative}.bar{display:flex;justify-content:space-between;border-bottom:2px solid #e8e8e2;padding-bottom:12px;font-size:24px}.brand{font-weight:900;letter-spacing:4px}.amber{color:#f0ad24}.body{display:grid;grid-template-columns:1fr 1fr;gap:28px;flex:1;min-height:0;padding-top:28px}.pane{border:1px solid #767873;padding:18px;min-width:0}.title{font-size:22px;color:#f0ad24;border-bottom:1px solid #767873;padding-bottom:10px;margin-bottom:14px}.reading{font-size:170px;line-height:.9;font-weight:700}.unit{font-size:34px}.cond{font-size:31px;margin:18px 0}.line{font-size:22px;line-height:1.8;color:#c4c5bd}.row{display:flex;justify-content:space-between;border-bottom:1px dotted #767873;padding:12px 0;font-size:24px}.todo{margin-top:18px}.todo div{padding:13px 0;border-bottom:1px solid #3e4140;font-size:25px;line-height:1.4}.tag{color:#f0ad24;margin-right:10px}.quote{margin-top:auto;border-top:1px solid #767873;padding-top:22px;font-family:"Songti SC","SimSun",serif}.quote p{font-size:34px;line-height:1.7}.from{text-align:right;color:#aaa;margin-top:10px;font-size:20px}.foot{border-top:1px solid #767873;padding-top:10px;margin-top:18px;color:#aaa;font-size:18px}
@media (min-width:1200px){html,body{width:1448px;height:1072px}.page{padding:28px 48px}.body{grid-template-columns:1.1fr .9fr 1fr;gap:22px;padding-top:22px}.pane{padding:16px}.reading{font-size:128px}.cond{font-size:27px;margin:12px 0}.line,.row{font-size:20px}.row{padding:8px 0}.todo div{font-size:22px;padding:9px 0}.quote{grid-column:auto;display:block;margin-top:0}.quote p{font-size:29px}.foot{margin-top:10px}}
</style>
</head>
<body>
<div class="page"><img class="wallpaper" id="wallpaper" alt=""><header class="bar"><span class="brand">INFO//SCREEN <span class="amber">LIVE</span></span><span id="clock">--:--</span></header><main class="body"><section class="pane"><div class="title">WEATHER / 天气</div><div class="reading"><span id="temp">--</span><span class="unit">°C</span></div><div class="cond" id="cond">等待数据</div><div class="line" id="detail"></div><div id="forecast"></div></section><section class="pane"><div class="title">QUEUE / 待办</div><div class="todo" id="todo"></div><div class="title" style="margin-top:28px">COUNTDOWN / 倒数</div><div id="countdowns"></div></section><section class="pane quote"><div class="title">MESSAGE / 一言</div><p id="quote">今天没有摘到一言。</p><div class="from" id="from"></div></section></main><footer class="foot"><span id="date"></span><span id="credit">KINDLE INFORMATION DISPLAY</span></footer></div>
<script>
const D=/*__DATA__*/null,w=D.weather||{};if(D.wallpaper)wallpaper.src=D.wallpaper.file;else wallpaper.remove();clock.textContent=D.time;date.textContent=D.date+" · "+D.weekday;if(D.wallpaper)credit.textContent="BING IMAGE · " + (D.wallpaper.credit||"");if(D.weather){temp.textContent=w.temp;cond.textContent=w.code+" · "+w.city;detail.textContent=["WIND "+w.wind+" KM/H",w.aqi!=null&&("PM2.5 "+w.pm25+" / "+w.aqi_desc)].filter(Boolean).join(" · ");forecast.innerHTML=(w.days||[]).map(d=>`<div class="row"><span>${d.label} ${d.code}</span><span>${d.hi}°/${d.lo}°</span></div>`).join("")}
const ts=D.todo||[];todo.innerHTML=(ts.length?ts:["今日无事"]).map(x=>`<div><span class="tag">›</span>${x}</div>`).join("");countdowns.innerHTML=(D.countdowns||[]).slice(0,5).map(x=>`<div class="row"><span>${x.name}</span><span class="amber">${x.days}d</span></div>`).join("")||'<div class="line">NO COUNTDOWN</div>';const y=D.yiyan;if(y&&y.text){quote.textContent="“"+y.text+"”";from.textContent="— "+(y.who||y.from||"")}
</script>
</body>
</html>
