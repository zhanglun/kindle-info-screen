<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- kindle-template: name=专注大字钟 orientations=portrait,landscape -->
<style>
  /* 专注大字钟 —— 超大时间 + 一言, 挂墙极简 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1072px; height: 1448px; background: #fbfaf6; color: #141414;
    font-family: "Helvetica Neue", "PingFang SC", sans-serif;
    font-variant-numeric: tabular-nums; overflow: hidden; }
  .page { width: 100%; height: 100%; padding: 70px 64px 54px;
    display: flex; flex-direction: column; align-items: center; text-align: center; }

  .top { width: 100%; display: flex; justify-content: space-between; font-size: 26px; color: #444; }
  .clock { margin: auto 0; font-weight: 200; letter-spacing: -6px;
    font-size: 340px; line-height: 0.95; }
  .clock small { font-size: 90px; font-weight: 300; letter-spacing: 0; }
  .sec { font-size: 30px; letter-spacing: 14px; color: #333; margin-bottom: 26px; }

  .hair { width: 220px; border-top: 2px solid #141414; margin: 30px 0; }
  .quote { max-width: 78%; font-family: "Songti SC", "STSong", serif;
    font-size: 40px; line-height: 1.9; font-weight: 600; }
  .from { margin-top: 22px; font-size: 24px; color: #555; }

  .foot { width: 100%; display: flex; justify-content: space-between;
    border-top: 1px solid #999; padding-top: 18px; font-size: 23px; color: #444; }

  @media (min-width: 1200px) {
    html, body { width: 1448px; height: 1072px; }
    .page { padding: 46px 64px 40px; flex-direction: row; flex-wrap: wrap; align-content: center; }
    .top { position: absolute; top: 46px; left: 64px; right: 64px; }
    .clock { font-size: 380px; margin: 0; width: 62%; text-align: right; }
    .right { width: 34%; display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
    .hair { margin: 22px 0; }
    .quote { font-size: 32px; }
    .foot { position: absolute; bottom: 40px; left: 64px; right: 64px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <span id="date"></span>
    <span id="weather"></span>
  </div>
  <div class="clock" id="clock">--<small>:</small>--</div>
  <div class="right">
    <div class="sec" id="lunarline"></div>
    <div class="hair"></div>
    <div class="quote" id="qtext">今天没有摘到一言,明天再来。</div>
    <div class="from" id="qfrom"></div>
  </div>
  <div class="foot">
    <span id="todo"></span>
    <span id="next"></span>
  </div>
</div>
<script>
const DATA = /*__DATA__*/null;
document.getElementById("date").textContent = DATA.date + " · " + DATA.weekday;
const w = DATA.weather;
document.getElementById("weather").textContent =
  w ? w.code + " " + w.temp + "°C · " + w.city : (DATA.weather_error || "");
document.getElementById("clock").innerHTML =
  String(Math.floor((DATA.time || "00:00").slice(0,2))) + "<small>:</small>" + (DATA.time || "00:00").slice(3);

const lunarBits = [DATA.lunar && "农历 " + DATA.lunar, DATA.jieqi].filter(Boolean);
document.getElementById("lunarline").textContent = lunarBits.join(" · ");

const y = DATA.yiyan;
if (y && y.text) {
  document.getElementById("qtext").textContent = y.text;
  document.getElementById("qfrom").textContent =
    "—— " + (y.who ? y.who + (y.from ? "《" + y.from + "》" : "") : y.from);
}
const todo = DATA.todo || [];
document.getElementById("todo").textContent =
  todo.length ? "待办 " + todo.length + " 项 · " + todo[0] : "今日无事";
const cd = (DATA.countdowns || [])[0];
document.getElementById("next").textContent =
  cd ? "距" + cd.name + " " + cd.days + " 天" : DATA.time + " 更新";
</script>
</body>
</html>
