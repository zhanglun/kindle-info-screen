<!DOCTYPE html>
<html lang="zh-CN" data-orientation="/*__ORIENTATION__*/portrait">
<head>
<meta charset="utf-8">
<!-- kindle-template: name=静默须知 orientations=portrait,landscape -->
<style>
  /* 静默须知 —— 状态优先:空白即正常。只写需要注意的事,没有事就承认没有事。
     大面积留白是版面的主角;出现的内容即当天的全部注意力。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1072px; height: 1448px; background: #ffffff; color: #161616;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden; }
  .page { width: 100%; height: 100%; padding: 56px 72px 48px; display: flex; flex-direction: column; }

  /* 页眉:只有一行小字,日期退到背景里 */
  .mast { display: flex; justify-content: space-between; align-items: baseline;
    font-size: 22px; color: #8a8a8a; letter-spacing: 1px; }
  .mast .now { font-variant-numeric: tabular-nums; }

  /* 注意力清单:页面唯一的声部 */
  .matters { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .matters .item { display: flex; align-items: baseline; gap: 26px;
    padding: 17px 0; font-size: 37px; line-height: 1.55; }
  .matters .item .kind { flex: none; font-size: 19px; color: #8a8a8a; letter-spacing: 3px;
    width: 118px; }
  .matters .item .txt { flex: 1; }
  .matters .item .meta { flex: none; font-size: 21px; color: #555;
    font-variant-numeric: tabular-nums; }
  .matters .item.urgent .txt { font-weight: 700; }

  /* 一切如常:整个页面只有这一行,加一枚月相 */
  .calm { flex: 1; display: flex; flex-direction: column; justify-content: center;
    align-items: flex-start; gap: 30px; }
  .calm .words { font-size: 46px; font-weight: 300; letter-spacing: 14px; color: #161616; }
  .calm .sky { display: flex; align-items: center; gap: 12px; font-size: 21px; color: #8a8a8a; }
  .calm .sky svg { width: 30px; height: 30px; }

  /* 页脚:更新时刻,右对齐,尽量小 */
  .foot { display: flex; justify-content: space-between; align-items: baseline;
    font-size: 18px; color: #aaaaaa; letter-spacing: 1px; }

  /* 横版(1448x1072):留白更大,清单垂直居中,右缘留出呼吸位 */
  @media (min-width: 1200px) {
    html, body { width: 1448px; height: 1072px; }
    .page { padding: 48px 96px 40px; }
    .matters .item { font-size: 34px; padding: 14px 0; max-width: 1060px; }
    .calm .words { font-size: 52px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="mast">
    <span id="dateLine">——</span>
    <span class="now" id="now"></span>
  </div>

  <div class="matters" id="matters" style="display:none"></div>

  <div class="calm" id="calm" style="display:none">
    <div class="words">一切如常</div>
    <div class="sky" id="skyLine"></div>
  </div>

  <div class="foot">
    <span>静默须知 · 空白即正常</span>
    <span id="stamp"></span>
  </div>
</div>
<script>
const DATA = /*__DATA__*/null;
const WMO = {0:"晴",1:"晴间多云",2:"多云",3:"阴",45:"雾",48:"雾凇",51:"毛毛雨",53:"毛毛雨",55:"毛毛雨",56:"冻雨",57:"冻雨",61:"小雨",63:"中雨",65:"大雨",66:"冻雨",67:"冻雨",71:"小雪",73:"中雪",75:"大雪",77:"雪粒",80:"阵雨",81:"阵雨",82:"强阵雨",85:"阵雪",86:"阵雪",95:"雷暴",96:"雷暴冰雹",99:"雷暴冰雹"};

const head = [DATA.date + " " + DATA.weekday];
if (DATA.lunar) head.push("农历" + DATA.lunar);
if (DATA.jieqi) head.push(DATA.jieqi);
document.getElementById("dateLine").textContent = head.join(" · ");
document.getElementById("now").textContent = DATA.time;
document.getElementById("stamp").textContent = "更新于 " + DATA.time;

/* 只收集真正需要注意的事 */
const items = [];
(DATA.schedule || []).forEach(s => {
  items.push({ kind: "日程", txt: s.title, meta: s.all_day ? "全天" : s.time });
});
(DATA.todo || []).forEach(t => {
  items.push({ kind: "待办", txt: t });
});
(DATA.countdowns || []).filter(c => c.days >= 0 && c.days <= 3).forEach(c => {
  items.push({ kind: "临近", txt: "距「" + c.name + "」还有 " + c.days + " 天",
               meta: c.date, urgent: c.days <= 1 });
});
const w = DATA.weather;
if (w && w.wc != null) {
  const code = Number(w.wc);
  const wet = (code >= 51 && code <= 67) || (code >= 71 && code <= 86) || code >= 95;
  if (wet) items.unshift({ kind: "天气", txt: "今天「" + (WMO[code] || w.code || "有雨") + "」,记得带伞",
                           meta: w.temp + "°C", urgent: true });
}

const matters = document.getElementById("matters");
const calm = document.getElementById("calm");
if (items.length) {
  calm.style.display = "none";
  matters.style.display = "flex";
  matters.innerHTML = items.map(it =>
    '<div class="item' + (it.urgent ? " urgent" : "") + '"><span class="kind">' + it.kind +
    '</span><span class="txt">' + it.txt + '</span><span class="meta">' + (it.meta || "") +
    '</span></div>').join("");
} else {
  matters.style.display = "none";
  calm.style.display = "flex";
  const sky = [];
  if (DATA.moon) sky.push(DATA.moon.name + " · 月面照亮 " + DATA.moon.illum + "%");
  if (w) sky.push((w.code || "") + " " + w.temp + "°C");
  document.getElementById("skyLine").textContent = sky.join(" · ") || "今天没有安排";
}
</script>
</body>
</html>
