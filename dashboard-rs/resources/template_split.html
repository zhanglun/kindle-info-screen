<!DOCTYPE html>
<html lang="zh-CN" data-orientation="/*__ORIENTATION__*/portrait">
<head>
<meta charset="utf-8">
<!-- kindle-template: name=左右分栏 orientations=portrait,landscape -->
<style>
  /* 左右分栏 —— TRMNL Mashup「1 Left, 1 Right」。
     结构先行:外框 + 表头条 + 中缝把屏面切成两个 View,信息各归其位。
     数据一律等宽字,标题条用反白,像仪表铭牌而不是文章。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1072px; height: 1448px; background: #ffffff; color: #111111;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden; }
  .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  .frame { width: 100%; height: 100%; padding: 28px; display: flex; flex-direction: column; }
  .shell { flex: 1; min-height: 0; border: 3px solid #111; display: flex; flex-direction: column; }

  /* 表头条:模板名 + 更新时刻 */
  .titlebar { display: flex; justify-content: space-between; align-items: center;
    background: #111; color: #fff; padding: 10px 20px;
    font-size: 19px; letter-spacing: 4px; }
  .titlebar .mono { letter-spacing: 1px; font-size: 18px; }

  /* 双 View:左右各半,中缝即结构 */
  .views { flex: 1; min-height: 0; display: flex; }
  .view { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .view + .view { border-left: 2px solid #111; }
  .viewhead { display: flex; justify-content: space-between; align-items: baseline;
    padding: 12px 20px; border-bottom: 1px solid #111;
    font-size: 18px; letter-spacing: 5px; color: #555; }
  .viewbody { flex: 1; min-height: 0; padding: 20px; overflow: hidden;
    display: flex; flex-direction: column; }

  /* 左 View = 现在:时刻大字 + 天气 */
  .now .clock { font-size: 128px; line-height: 1; letter-spacing: 2px; }
  .now .dateline { font-size: 23px; color: #444; margin-top: 10px; line-height: 1.6; }
  .wxblock { margin-top: 26px; border-top: 1px solid #111; padding-top: 18px; }
  .wxblock .temp { font-size: 84px; font-weight: 300; line-height: 1; }
  .wxblock .temp sup { font-size: 30px; }
  .wxblock .cond { font-size: 27px; font-weight: 700; margin-top: 8px; }
  .wxblock .sub { font-size: 19px; color: #555; margin-top: 8px; line-height: 1.7; }
  .mini5 { display: flex; margin-top: 16px; border-top: 1px solid #d8d8d8; }
  .mini5 .m { flex: 1; padding: 8px 0 0; font-size: 18px; color: #555; }
  .mini5 .m + .m { border-left: 1px solid #d8d8d8; padding-left: 10px; margin-left: 0; }
  .mini5 .m b { display: block; color: #111; font-size: 21px; margin-top: 2px; }

  /* 右 View = 事务:待办 + 日程 + 倒数条 */
  .taskhead { display: flex; justify-content: space-between; align-items: baseline;
    font-size: 21px; font-weight: 700; letter-spacing: 3px;
    border-bottom: 1px solid #d8d8d8; padding-bottom: 6px; }
  .taskhead .n { font-size: 17px; color: #888; font-weight: 400; letter-spacing: 0; }
  .todo li { list-style: none; display: flex; gap: 14px; align-items: flex-start;
    padding: 9px 0; font-size: 25px; line-height: 1.55; }
  .todo .box { flex: none; width: 18px; height: 18px; border: 2px solid #111; margin-top: 10px; }
  .todo .none { font-size: 20px; color: #888; padding: 8px 0; }
  .sched { margin-top: 16px; }
  .sched .ev { display: flex; gap: 16px; align-items: baseline; padding: 6px 0;
    font-size: 23px; border-bottom: 1px solid #ececec; }
  .sched .ev .mono { color: #555; font-size: 20px; width: 92px; flex: none; }
  .cdstrip { border-top: 1px solid #111; margin-top: auto; padding-top: 12px;
    display: flex; flex-wrap: wrap; gap: 4px 34px; font-size: 20px; }
  .cdstrip b { font-size: 27px; padding: 0 3px; }

  /* 横版(1448x1072):左右比例 42/58,时刻字降号,塞下更多待办 */
  @media (min-width: 1200px) {
    html, body { width: 1448px; height: 1072px; }
    .frame { padding: 24px; }
    .view-l { flex: 0 0 42%; }
    .now .clock { font-size: 96px; }
    .wxblock .temp { font-size: 64px; }
    .now .dateline { font-size: 20px; }
    .todo li { font-size: 22px; padding: 6px 0; }
    .sched .ev { font-size: 20px; padding: 4px 0; }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="shell">
    <div class="titlebar">
      <span>对屏 · LEFT / RIGHT</span>
      <span class="mono" id="stamp"></span>
    </div>
    <div class="views">
      <div class="view view-l">
        <div class="viewhead"><span>现在</span><span class="mono" id="moon"></span></div>
        <div class="viewbody now">
          <div class="clock mono" id="clock"></div>
          <div class="dateline" id="dateline"></div>
          <div class="wxblock">
            <span class="temp"><span id="temp">--</span><sup>°C</sup></span>
            <div class="cond" id="cond">——</div>
            <div class="sub" id="wxsub"></div>
            <div class="mini5" id="mini5"></div>
          </div>
        </div>
      </div>
      <div class="view">
        <div class="viewhead"><span>今日事务</span><span class="mono" id="counts"></span></div>
        <div class="viewbody">
          <div class="taskhead">日程<span class="n" id="schedn"></span></div>
          <div class="sched" id="sched"></div>
          <div class="taskhead" style="margin-top:14px">待办<span class="n" id="todon"></span></div>
          <ul class="todo" id="todo"></ul>
          <div class="cdstrip mono" id="cds"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const DATA = /*__DATA__*/null;
document.getElementById("stamp").textContent = "UPD " + DATA.time;
document.getElementById("clock").textContent = DATA.time;
const dl = [DATA.date + " " + DATA.weekday];
if (DATA.lunar) dl.push("农历" + DATA.lunar);
if (DATA.jieqi) dl.push(DATA.jieqi);
document.getElementById("dateline").textContent = dl.join(" · ");
document.getElementById("moon").textContent = DATA.moon ? DATA.moon.name : "";

const w = DATA.weather;
if (w) {
  document.getElementById("temp").textContent = w.temp;
  document.getElementById("cond").textContent = w.code + " · " + w.city;
  const sub = ["风 " + w.wind + " km/h", "日出 " + w.sunrise + " · 日落 " + w.sunset];
  if (w.aqi != null) sub.push("空气 " + w.aqi_desc);
  document.getElementById("wxsub").innerHTML = sub.join(" · ");
  document.getElementById("mini5").innerHTML = w.days.map(d =>
    '<div class="m">' + d.label + '<b>' + d.hi + '°/' + d.lo + '°</b>' + d.code + '</div>').join("");
} else {
  document.getElementById("cond").textContent = DATA.weather_error || "暂无天气数据";
}

const sched = DATA.schedule || [];
document.getElementById("schedn").textContent = sched.length ? sched.length + " 项" : "无";
document.getElementById("sched").innerHTML = sched.length
  ? sched.map(s => '<div class="ev"><span class="mono">' + (s.all_day ? "全天" : s.time) +
      '</span><span>' + s.title + '</span></div>').join("")
  : '<div style="font-size:20px;color:#888;padding:8px 0">今天没有日程</div>';

const todo = DATA.todo || [];
document.getElementById("todon").textContent = todo.length ? todo.length + " 项" : "无";
document.getElementById("todo").innerHTML = todo.length
  ? todo.map(t => '<li><span class="box"></span><span>' + t + '</span></li>').join("")
  : '<div class="none">今日无待办</div>';

const cds = DATA.countdowns || [];
document.getElementById("counts").textContent =
  "待办 " + todo.length + " · 日程 " + sched.length;
document.getElementById("cds").innerHTML = cds.slice(0, 4).map(c =>
  '<span>距' + c.name + ' <b>' + c.days + '</b> 天</span>').join("");
</script>
</body>
</html>
