<!DOCTYPE html>
<html lang="zh-CN" data-orientation="/*__ORIENTATION__*/portrait">
<head>
<meta charset="utf-8">
<!-- kindle-template: name=画廊铭牌 orientations=portrait,landscape -->
<style>
  /* 画廊铭牌 —— 把此刻挂进画框:卡纸留白 + 双线画框,
     时刻是唯一的展品,下方一小方铭牌说明它。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1072px; height: 1448px; background: #f7f5ef; color: #1c1b18;
    font-family: Georgia, "Times New Roman", "SimSun", "NSimSun", serif;
    -webkit-font-smoothing: antialiased; overflow: hidden; }

  /* 卡纸与画框:外白卡纸,内双线框 */
  .mat { width: 100%; height: 100%; padding: 46px; }
  .frame { width: 100%; height: 100%; border: 2px solid #1c1b18; position: relative;
    display: flex; flex-direction: column; }
  .frame::after { content: ""; position: absolute; inset: 7px;
    border: 1px solid #1c1b18; pointer-events: none; }

  /* 展品:时刻 */
  .piece { flex: 1; display: flex; flex-direction: column; justify-content: center;
    align-items: center; }
  .piece .time { font-size: 250px; line-height: 1; letter-spacing: 4px;
    font-variant-numeric: tabular-nums; }
  .piece .time .colon { transform: translateY(-14px); display: inline-block; }
  .piece .ampm { margin-top: 26px; font-size: 22px; letter-spacing: 10px; color: #6b6960; }

  /* 铭牌:画框内底部居中的一小方 */
  .plaque { margin: 0 auto 52px; text-align: center; padding: 20px 44px 22px;
    border: 1px solid #1c1b18; background: #fdfcf9; max-width: 78%; }
  .plaque .l1 { font-size: 29px; letter-spacing: 4px; }
  .plaque .l2 { font-size: 20px; color: #55534c; margin-top: 10px; letter-spacing: 1px; }
  .plaque .l3 { font-size: 17px; color: #8a877d; margin-top: 8px; letter-spacing: 2px; }

  /* 横版(1448x1072):时刻降号,铭牌并入一行 */
  @media (min-width: 1200px) {
    html, body { width: 1448px; height: 1072px; }
    .mat { padding: 40px; }
    .piece .time { font-size: 176px; }
    .plaque { margin-bottom: 44px; padding: 16px 40px 18px; }
    .plaque .l1 { font-size: 25px; }
    .plaque .l2 { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="mat">
  <div class="frame">
    <div class="piece">
      <div class="time" id="clock">--<span class="colon">:</span>--</div>
      <div class="ampm" id="ampm"></div>
    </div>
    <div class="plaque">
      <div class="l1" id="l1">——</div>
      <div class="l2" id="l2"></div>
      <div class="l3" id="l3"></div>
    </div>
  </div>
</div>
<script>
const DATA = /*__DATA__*/null;
const parts = DATA.time.split(":");
document.getElementById("clock").innerHTML =
  parts[0] + '<span class="colon">:</span>' + parts[1];
document.getElementById("ampm").textContent = DATA.weekday;

const l1 = [DATA.date];
if (DATA.lunar) l1.push("农历" + DATA.lunar);
document.getElementById("l1").textContent = l1.join(" · ");

const l2 = [];
if (DATA.jieqi) l2.push(DATA.jieqi);
if (DATA.moon) l2.push(DATA.moon.name);
const w = DATA.weather;
if (w) l2.push(w.code + " " + w.temp + "°C",
  (w.days[0] ? w.days[0].lo + "° ~ " + w.days[0].hi + "°" : ""));
document.getElementById("l2").textContent =
  l2.length ? l2.join(" · ") : (DATA.weather_error || "");

const l3 = [w ? w.city : "", "更新于 " + DATA.time];
document.getElementById("l3").textContent = l3.filter(Boolean).join(" · ");
</script>
</body>
</html>
