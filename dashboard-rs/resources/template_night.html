<!DOCTYPE html>
<html lang="zh-CN" data-orientation="/*__ORIENTATION__*/portrait">
<head>
<meta charset="utf-8">
<!-- kindle-template: name=夜钟 orientations=portrait,landscape -->
<style>
  /* 夜钟 —— 夜里看的时钟。墨色底, 白墨巨时, 几颗星。
     日期农历在上, 天气一行为注, 一言收底。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1072px; height: 1448px; background: #0b0b0b; color: #f2f2ef;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased; overflow: hidden; }
  .page { width: 100%; height: 100%; padding: 110px 96px 88px;
    display: flex; flex-direction: column; }

  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .date { font-size: 30px; font-weight: 700; }
  .date span { font-size: 23px; font-weight: 400; color: #8f8f8a; margin-left: 14px; }
  .lunar { font-size: 21px; color: #8f8f8a; margin-top: 10px; letter-spacing: 1px; }
  .moonline { display: flex; align-items: center; gap: 12px;
    font-size: 21px; color: #8f8f8a; }
  .moonline svg { width: 32px; height: 32px; }

  .clock { font-size: 280px; font-weight: 150; line-height: 1;
    letter-spacing: -0.015em; margin: auto 0;
    font-variant-numeric: tabular-nums; }

  .rule { height: 0; border-top: 1px solid #3a3a3a; }
  .wx { display: flex; align-items: baseline; gap: 24px; margin-top: 34px; }
  .wx .temp { font-size: 74px; font-weight: 200; line-height: 1;
    font-variant-numeric: tabular-nums; }
  .wx .temp i { font-style: normal; font-size: 38px; }
  .wx .side { font-size: 27px; font-weight: 600; }
  .wx .side small { display: block; font-size: 19px; font-weight: 400;
    color: #8f8f8a; margin-top: 6px; }

  .idiom-line { margin-top: 40px; font-size: 22px; color: #9a9a95; }

  /* 横版: 左巨时钟, 右侧信息纵列 */
  @media (min-width: 1200px) {
    html, body { width: 1448px; height: 1072px; }
    .page { flex-direction: row; gap: 0; padding: 96px 96px 84px; }
    .col-l { width: 55%; padding-right: 72px; display: flex; flex-direction: column; }
    .col-r { flex: 1; border-left: 1px solid #2a2a2a; padding-left: 72px;
             display: flex; flex-direction: column; }
    .clock { font-size: 220px; margin: 64px 0 56px; }
    .wx { margin-top: 40px; }
    .idiom-line { margin-top: auto; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="col-l">
    <div class="top">
      <div>
        <div class="date" id="d">——</div>
        <div class="lunar" id="lunar"></div>
      </div>
      <div class="moonline" id="moonline"></div>
    </div>
    <div class="clock" id="t">--:--</div>
    <div class="rule"></div>
    <div class="wx">
      <span class="temp" id="temp">--<i>°</i></span>
      <span class="side" id="cond">——<small id="wxsub"></small></span>
    </div>
    <div class="idiom-line" id="idiomline"></div>
  </div>
  <div class="col-r"></div>
</div>
<script>
const DATA = /*__DATA__*/null;

document.getElementById("d").innerHTML = DATA.date + "<span>" + DATA.weekday + "</span>";
const lunarBits = [];
if (DATA.lunar) lunarBits.push("农历 " + DATA.lunar);
if (DATA.jieqi) lunarBits.push(DATA.jieqi);
document.getElementById("lunar").textContent = lunarBits.join(" · ");
document.getElementById("t").textContent = DATA.time;

const w = DATA.weather;
if (w) {
  document.getElementById("temp").innerHTML = w.temp + "<i>°</i>";
  const hi = w.days && w.days[0] ? w.days[0].hi : null;
  const lo = w.days && w.days[0] ? w.days[0].lo : null;
  document.getElementById("cond").innerHTML =
    w.code + "<small>" + w.city +
    (hi != null && lo != null ? " · 今日 " + hi + "° / " + lo + "°" : "") + "</small>";
} else {
  document.getElementById("cond").textContent = DATA.weather_error || "暂无天气数据";
}

function moonSvg(name){
  const o = 'fill="none" stroke="#f2f2ef" stroke-width="1.6"', f = 'fill="#f2f2ef"';
  const p = {
    "新月": `<circle cx="12" cy="12" r="9" ${o}/>`,
    "娥眉月": `<circle cx="12" cy="12" r="9" ${o}/><path d="M12,3 A9,9 0 0 1 12,21 A4,9 0 0 0 12,3 Z" ${f}/>`,
    "上弦月": `<circle cx="12" cy="12" r="9" ${o}/><path d="M12,3 A9,9 0 0 1 12,21 Z" ${f}/>`,
    "盈凸月": `<circle cx="12" cy="12" r="9" ${o}/><path d="M12,3 A9,9 0 0 1 12,21 A5.5,9 0 0 1 12,3 Z" ${f}/>`,
    "满月": `<circle cx="12" cy="12" r="9" ${o}/><circle cx="12" cy="12" r="9" ${f}/>`,
    "亏凸月": `<circle cx="12" cy="12" r="9" ${o}/><path d="M12,3 A9,9 0 0 0 12,21 A5.5,9 0 0 0 12,3 Z" ${f}/>`,
    "下弦月": `<circle cx="12" cy="12" r="9" ${o}/><path d="M12,3 A9,9 0 0 0 12,21 Z" ${f}/>`,
    "残月": `<circle cx="12" cy="12" r="9" ${o}/><path d="M12,3 A9,9 0 0 0 12,21 A4,9 0 0 1 12,3 Z" ${f}/>`
  };
  return `<svg viewBox="0 0 24 24">${p[name] || p["满月"]}</svg>`;
}
if (DATA.moon) {
  document.getElementById("moonline").innerHTML =
    moonSvg(DATA.moon.name) + "<span>" + DATA.moon.name + "</span>";
}
const y = DATA.yiyan;
if (y && y.text) {
  document.getElementById("idiomline").textContent =
    "「" + y.text + "」" + (y.who ? " —— " + y.who : "");
}
</script>
</body>
</html>
