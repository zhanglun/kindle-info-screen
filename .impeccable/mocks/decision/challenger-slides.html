<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  /* 时刻表玻璃片架 —— 金盏黄灯箱 · 全页单一字号 · 字重/反白/界线定等级
     每个模块是一片斜插灯箱的色玻璃片 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #d9a441; color: #241c0d;
    font-family: -apple-system, "PingFang SC", sans-serif; font-size: 13px; }
  .page { max-width: 1280px; margin: 0 auto; padding: 20px 30px 40px; }

  header { display: flex; align-items: center; gap: 12px; padding-bottom: 12px;
    border-bottom: 2px solid #241c0d; }
  h1 { font-weight: 900; }
  .sub { opacity: .65; }
  .rev { margin-left: auto; background: #241c0d; color: #f4e3ba; padding: 4px 12px; font-weight: 700; }

  /* 片架: 玻璃片斜插 */
  .rack { display: grid; grid-template-columns: 420px 1fr 1fr; gap: 14px; margin-top: 18px; align-items: start; }
  .slide { background: #f4e3ba; border: 1px solid #241c0d; box-shadow: 4px 4px 0 rgba(36,28,13,.35);
    padding: 12px 14px 14px; }
  .slide.tint { background: #eed49a; }
  .shead { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #241c0d; padding-bottom: 6px; margin-bottom: 8px; }
  .shead b { background: #241c0d; color: #f4e3ba; padding: 2px 9px; font-weight: 900; }
  .shead span { opacity: .6; }
  .shead .r { margin-left: auto; font-weight: 900; }

  .frow { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
  .frow .k { width: 66px; opacity: .62; flex: none; }
  .frow input, .frow select { flex: 1; font: inherit; color: #241c0d; background: rgba(255,255,255,.55);
    border: 1px solid #241c0d; padding: 4px 8px; }
  .frow input:focus { outline: 2px solid #241c0d; }

  /* 反白条 = 最强等级 */
  .revbar { background: #241c0d; color: #f4e3ba; padding: 5px 10px; font-weight: 900;
    display: flex; gap: 10px; margin-top: 4px; }
  img { width: 100%; display: block; border: 1px solid #241c0d; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid #241c0d; padding: 3px 10px; cursor: pointer; }
  .chip.on { background: #241c0d; color: #f4e3ba; font-weight: 900; }

  .press { display: flex; gap: 8px; margin-top: 10px; }
  .btn { font: inherit; font-weight: 900; background: #241c0d; color: #f4e3ba;
    border: none; padding: 8px 24px; cursor: pointer; }
  .btn.ghost { background: transparent; color: #241c0d; border: 1px solid #241c0d; }
  .log { margin-top: 8px; border-top: 1px solid #241c0d; padding-top: 6px; }
  .log div { display: flex; gap: 10px; padding: 3px 0; }
  .log .t { font-weight: 900; width: 44px; }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Kindle 信息屏</h1>
    <span class="sub">CONFIG · SLIDE RACK</span>
    <span class="rev">已上屏 12:25 · NEXT 12:35</span>
  </header>

  <div class="rack">
    <div class="slide">
      <div class="shead"><b>预览</b><span>PREVIEW</span><span class="r">192.168.89.1:8787</span></div>
      <img alt="" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='360' height='470'%3E%3Crect width='360' height='470' fill='%23f4e3ba'/%3E%3Crect x='0' y='0' width='360' height='36' fill='%23241c0d'/%3E%3Ctext x='14' y='24' font-size='14' fill='%23f4e3ba' font-weight='900'%3EINFO BOARD%3C/text%3E%3Ctext x='14' y='92' font-size='42' fill='%23241c0d' font-weight='900'%3E12:25%3C/text%3E%3Crect x='14' y='110' width='120' height='16' fill='%23241c0d'/%3E%3Ctext x='20' y='122' font-size='11' fill='%23f4e3ba'%3E22°C 晴 杭州%3C/text%3E%3C/svg%3E">
    </div>

    <div class="slide tint">
      <div class="shead"><b>版面</b><span>TEMPLATE</span></div>
      <div class="revbar">时刻表 · PORTRAIT / LANDSCAPE</div>
      <div class="frow" style="margin-top:6px"><span class="k">朝向</span>
        <select><option>横版 1448×1072</option></select></div>
      <div class="frow"><span class="k">城市</span><input value="杭州"></div>
      <div class="frow"><span class="k">刷新</span><input value="10 分钟" style="max-width:110px"></div>
      <div class="frow"><span class="k">端口</span><input value="8787" style="max-width:110px"></div>
      <div class="press">
        <button class="btn">保存并刷新</button>
        <button class="btn ghost">仅保存</button>
      </div>
    </div>

    <div class="slide">
      <div class="shead"><b>模块</b><span>MODULES</span></div>
      <div class="frow"><span class="k">天气</span><input value="open-meteo · 杭州"></div>
      <div class="frow"><span class="k">日程</span><input value="ics://calendar.icloud.com/…"></div>
      <div class="frow"><span class="k">热榜</span><input value="微博 + 知乎" style="max-width:150px"></div>
      <div class="frow"><span class="k">壁纸</span><input value="Bing 每日一图 · 抖动灰度" style="max-width:210px"></div>
      <div class="shead" style="margin-top:10px"><b>渲染史</b><span>RENDER LOG</span></div>
      <div class="log">
        <div><span class="t">12:25</span><span>OK · 时刻表 · 横版 · 56 KB</span></div>
        <div><span class="t">12:15</span><span>OK · 时刻表 · 竖版 · 91 KB</span></div>
        <div><span class="t">12:05</span><span>OK · 信息日报 · 99 KB</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
